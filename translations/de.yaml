configuration:
  log_level:
    name: Log-Level
    description: Detailgrad der Protokollierung (debug, info, warning, error).
  provider:
    name: KI-Anbieter
    description: Anbieter des Sprachmodells für die Planung.
  model:
    name: Modell
    description: Konkretes Modell des gewählten Anbieters (Standard gemini-2.5-flash).
  ai_temperature:
    name: KI-Temperatur
    description: Sampling-Temperatur des KI-Aufrufs (0 = deterministisch). Niedrige Werte sorgen dafür, dass gleicher Kontext stabil dieselben Vorschlagsfelder liefert, statt je Lauf zu schwanken.
  ai_seed:
    name: KI-Seed
    description: Fester Zufalls-Seed für den KI-Aufruf – verstärkt reproduzierbare, stabile Ausgaben über mehrere Läufe.
  ai_repair_missing:
    name: Fehlende Felder nachfordern
    description: Lässt das Modell fehlende Pflicht-Vorschlagsfelder aus, werden genau diese einmalig nachgefordert, bevor der Validator sie deterministisch aus dem Ist-Zustand auffüllt.
  planning_interval_min:
    name: Planungsintervall (Minuten)
    description: Abstand der vollständigen Neuplanung (15–60 Minuten).
  plan_update_interval_min:
    name: Aktualisierungsintervall (Minuten)
    description: Abstand der Planprüfung auf Abweichungen.
  forecast_horizon_h:
    name: Prognosehorizont (Stunden)
    description: Vorausschauzeitraum der Planung (12–48 Stunden).
  min_confidence_percent:
    name: Mindestkonfidenz (%)
    description: Schwelle, unterhalb derer ein Plan nicht automatisch übernommen wird.
  collect_interval_s:
    name: Erfassungsintervall (Sekunden)
    description: Abstand, in dem Live-Werte aus Home Assistant gelesen werden.
  publish_suggestions:
    name: Vorschläge nach HA schreiben
    description: Validierte Vorschlagswerte als sensor.ep_*_vorschlag in Home Assistant schreiben. Aus => reiner Beobachten-Modus (keine HA-Sensoren).
  entity_pv_power:
    name: Entität PV-Leistung
    description: HA-Entität für die aktuelle PV-Leistung (z.B. sensor.e3dc_leistung_pv).
  entity_house_load:
    name: Entität Hausverbrauch
    description: HA-Entität für den aktuellen Hausverbrauch (z.B. sensor.e3dc_leistung_haus).
  entity_grid_power:
    name: Entität Netzleistung
    description: HA-Entität für die Leistung am Netzübergabepunkt.
  entity_grid_import:
    name: Entität Netzbezug
    description: HA-Entität für den Netzbezug.
  entity_grid_export:
    name: Entität Einspeisung
    description: HA-Entität für die Netzeinspeisung.
  entity_battery_power:
    name: Entität Batterieleistung
    description: HA-Entität für die aktuelle Batterieleistung.
  entity_battery_soc:
    name: Entität Batterie-SOC
    description: HA-Entität für den Batterieladestand in Prozent.
  entity_water_temperature:
    name: Entität Warmwassertemperatur
    description: HA-Entität für die Warmwassertemperatur.
  fallback_pv_power:
    name: Fallback PV-Leistung
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_house_load:
    name: Fallback Hausverbrauch
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_grid_power:
    name: Fallback Netzleistung
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_grid_import:
    name: Fallback Netzbezug
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_grid_export:
    name: Fallback Einspeisung
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_battery_power:
    name: Fallback Batterieleistung
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_battery_soc:
    name: Fallback Batterie-SOC
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
  fallback_water_temperature:
    name: Fallback Warmwassertemperatur
    description: Ersatzwert, falls keine gültige Entität gefunden wird.
