# Skytech Energy Pilot – input_boolean Helfer
# NUR EP-eigene Schalter (ep_*). Inhalt unter "input_boolean:" einfügen.
#
#
# EP-Vorschlagswerte (z. B. ep_<name>_freigabe_vorschlag, D-030) sind KEINE Helfer,
# sondern stellt EP selbst als sensor.ep_*-Entitäten bereit.

# --- Globale EP-Schalter (ep_*, EP-eigen) ---
ep_aktiv:
  name: EP Aktiv
  icon: mdi:robot

ep_automatische_planung:
  name: EP Automatische Planung
  icon: mdi:calendar-sync

ep_ereignis_neuplanung:
  name: EP Ereignisbasierte Neuplanung
  icon: mdi:flash-alert
