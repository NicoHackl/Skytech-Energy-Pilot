<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skytech Energy Pilot</title>
  <style>
    /* ============================================================
       Skytech Energy Pilot – Weboberfläche im Home-Assistant-Design.
       Farben/Karten/Kopfleiste/Typografie sind an das HA-Standardtheme
       (Material Design) angelehnt. Alle IDs, Klassennamen und das
       <script> bleiben unverändert – nur das Aussehen wird angepasst.
       ============================================================ */

    /* ---- HA-Designtokens (Standardtheme, hell) ---- */
    :root {
      color-scheme: light dark;
      --ha-primary: #03a9f4;
      --ha-primary-dark: #0288d1;
      --ha-accent: #ff9800;
      --ha-bg: #f5f5f5;
      --ha-card-bg: #ffffff;
      --ha-text: #212121;
      --ha-text-secondary: #727272;
      --ha-text-disabled: #bdbdbd;
      --ha-divider: rgba(0, 0, 0, .12);
      --ha-error: #db4437;
      --ha-warning: #f57c00;
      --ha-success: #43a047;
      --ha-info: #039be5;
      --ha-header-bg: #03a9f4;
      --ha-header-text: #ffffff;
      --ha-header-text-dim: rgba(255, 255, 255, .72);
      --ha-radius: 12px;
      --ha-radius-sm: 6px;
      --ha-shadow: 0 2px 1px -1px rgba(0, 0, 0, .2),
                   0 1px 1px 0 rgba(0, 0, 0, .14),
                   0 1px 3px 0 rgba(0, 0, 0, .12);
      --ha-chip-bg: rgba(0, 0, 0, .06);
      --ha-hover: rgba(0, 0, 0, .04);
      --ha-code-bg: rgba(0, 0, 0, .05);
      --ha-font: Roboto, "Helvetica Neue", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ha-bg: #111111;
        --ha-card-bg: #1c1c1c;
        --ha-text: #e1e1e1;
        --ha-text-secondary: #9b9b9b;
        --ha-text-disabled: #6f6f6f;
        --ha-divider: rgba(225, 225, 225, .12);
        --ha-header-bg: #1c1c1c;
        --ha-chip-bg: rgba(255, 255, 255, .08);
        --ha-hover: rgba(255, 255, 255, .06);
        --ha-code-bg: rgba(255, 255, 255, .07);
        --ha-shadow: 0 2px 1px -1px rgba(0, 0, 0, .4),
                     0 1px 1px 0 rgba(0, 0, 0, .28),
                     0 1px 3px 0 rgba(0, 0, 0, .24);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--ha-font);
      margin: 0;
      background: var(--ha-bg);
      color: var(--ha-text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Kopfleiste (HA App-Bar) ---- */
    .ha-header {
      background: var(--ha-header-bg);
      color: var(--ha-header-text);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--ha-shadow);
    }
    .ha-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 16px;
    }
    .ha-logo { width: 26px; height: 26px; flex-shrink: 0; fill: currentColor; }
    .ha-title {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: .1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ---- Tabs (HA-View-Tabs mit Unterstrich-Indikator) ---- */
    .ha-tabs {
      display: flex;
      padding: 0 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ha-tabs::-webkit-scrollbar { display: none; }
    nav button {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--ha-header-text-dim);
      cursor: pointer;
      font-family: inherit;
      font-size: .875rem;
      font-weight: 500;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 14px 16px;
      white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    nav button.active { color: var(--ha-header-text); border-bottom-color: var(--ha-header-text); }
    nav button:hover:not(.active) { color: var(--ha-header-text); background: rgba(255, 255, 255, .08); }

    /* ---- Inhalt ---- */
    .ha-content { max-width: 1280px; margin: 0 auto; padding: 16px; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* ---- Karten (ha-card) ---- */
    .ha-card {
      background: var(--ha-card-bg);
      border-radius: var(--ha-radius);
      box-shadow: var(--ha-shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ha-text);
      margin-bottom: 12px;
    }
    .card-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
    .sub-title {
      font-size: .8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ha-text-secondary);
      margin: 18px 0 8px;
    }
    h1, h2, h3 { color: var(--ha-text); font-weight: 500; }
    h2 { margin: 4px 0 8px; }
    h3 { margin: 12px 0 6px; }

    /* ---- Beschreibungstexte ---- */
    .hint { font-size: .82rem; color: var(--ha-text-secondary); margin: 6px 0 10px; }
    .hint-inline { font-size: .82rem; color: var(--ha-text-secondary); }
    p { margin: 8px 0; }

    /* ---- Definition (Schlüssel/Wert) ---- */
    .kv {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .35rem 1.2rem;
      font-size: .88rem;
      align-items: baseline;
    }
    .kv > div:nth-child(odd) { color: var(--ha-text-secondary); }

    /* ---- Tabellen (HA-Datentabelle) ---- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--ha-divider); vertical-align: top; }
    th {
      color: var(--ha-text-secondary);
      font-weight: 500;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    tbody tr:hover { background: var(--ha-hover); }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---- Code ---- */
    code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: .82em;
      background: var(--ha-code-bg);
      padding: 1px 5px;
      border-radius: 4px;
    }
    pre {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: var(--ha-code-bg);
      padding: 12px;
      border-radius: var(--ha-radius-sm);
      overflow: auto;
    }
    pre code { background: none; padding: 0; }

    /* ---- Werkzeugleiste ---- */
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 8px 0; }

    /* ---- Schaltflächen (mwc-button-Anmutung) ---- */
    button, .btn-link {
      appearance: none;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 500;
      letter-spacing: .4px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: var(--ha-radius-sm);
      border: 1px solid var(--ha-divider);
      background: var(--ha-card-bg);
      color: var(--ha-primary);
      padding: 8px 14px;
      transition: background .15s, border-color .15s, opacity .15s;
      text-decoration: none;
      display: inline-block;
      line-height: 1.2;
    }
    button:hover, .btn-link:hover { background: rgba(3, 169, 244, .08); border-color: var(--ha-primary); }
    button:disabled { color: var(--ha-text-disabled); cursor: default; background: var(--ha-card-bg); border-color: var(--ha-divider); opacity: .6; }
    button.primary { background: var(--ha-primary); color: #fff; border-color: var(--ha-primary); }
    button.primary:hover { background: var(--ha-primary-dark); border-color: var(--ha-primary-dark); }

    /* ---- Eingabefelder (HA-Textfeld) ---- */
    input, select, textarea {
      font-family: inherit;
      font-size: .85rem;
      color: var(--ha-text);
      background: var(--ha-bg);
      border: 1px solid var(--ha-divider);
      border-radius: var(--ha-radius-sm);
      padding: 8px 10px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--ha-primary); }
    select { cursor: pointer; }
    textarea { width: 100%; box-sizing: border-box; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
    input[type="checkbox"] { accent-color: var(--ha-primary); width: auto; vertical-align: middle; }
    label { font-size: .85rem; }
    a { color: var(--ha-primary); }

    /* ---- Aufklappbereiche ---- */
    details { margin: 10px 0; border: 1px solid var(--ha-divider); border-radius: var(--ha-radius-sm); padding: 10px 12px; }
    summary { cursor: pointer; font-weight: 500; color: var(--ha-primary); }

    /* ---- Quellen-Kennzeichnung ---- */
    .src-live { color: var(--ha-success); }
    .src-fallback { color: var(--ha-warning); }
    .src-none { color: var(--ha-text-disabled); }

    /* ============================================================
       Responsive – KEIN horizontales Scrollen (nur vertikal).
       Tablet ≤900 px, Handy ≤480 px. Rein visuell/additiv.
       ============================================================ */

    /* Größere Touch-Ziele auf Finger-Geräten (kein feiner Zeiger). */
    @media (hover: none) and (pointer: coarse) {
      button, .btn-link { padding-top: 11px; padding-bottom: 11px; }
      nav button { padding-top: 14px; padding-bottom: 14px; }
    }

    /* Tablet: Tab-Leiste umbrechen statt seitlich scrollen, Formular einspaltig. */
    @media (max-width: 900px) {
      .ha-content { padding: 12px; }
      .ha-tabs { flex-wrap: wrap; overflow-x: visible; padding: 0 4px 4px; }
      .extra-form { grid-template-columns: 1fr !important; }
      .extra-form [style*="grid-column"] { grid-column: 1 / -1 !important; }
    }

    /* Handy: Tabellen → gestapelte Karten, alles bricht um. */
    @media (max-width: 480px) {
      body { font-size: 13.5px; }
      .ha-header-top { height: 52px; padding: 0 12px; }
      .ha-title { font-size: 1.1rem; }
      .ha-content { padding: 10px; }
      .ha-card { padding: 12px; }
      .card-title { font-size: 1rem; }
      .card-actions { width: 100%; }
      .card-actions button, .card-actions .btn-link { flex: 1 1 auto; text-align: center; }

      /* Tabelle als Kartenliste (kein overflow-x). */
      .table-wrap { overflow-x: visible; }
      table, tbody, tr, td { display: block; width: auto; }
      thead { display: none; } /* Kopf ausblenden – Spalten via data-label (JS) an den Zellen */
      tbody tr {
        border: 1px solid var(--ha-divider);
        border-radius: var(--ha-radius-sm);
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      tbody tr:hover { background: transparent; }
      tbody td { border: none; padding: 3px 0; }
      /* Zellen mit gespiegelter Spaltenüberschrift: Label links, Wert rechts. */
      tbody td[data-label] { display: flex; justify-content: space-between; gap: 1rem; text-align: right; }
      tbody td[data-label]::before {
        content: attr(data-label);
        color: var(--ha-text-secondary);
        font-weight: 500;
        text-align: left;
      }
      tbody td:empty { display: none; }

      /* Lange Inhalte umbrechen statt seitlich scrollen. */
      pre { white-space: pre-wrap; word-break: break-word; }
      code { word-break: break-word; }
      textarea, select, input { max-width: 100% !important; }
      #device-select { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- Preact + htm (vendored, kein Build). Reihenfolge: preact → hooks → htm → app. -->
  <script src="static/vendor/preact.umd.js"></script>
  <script src="static/vendor/hooks.umd.js"></script>
  <script src="static/vendor/htm.umd.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
