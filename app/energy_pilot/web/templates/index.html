<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skytech Energy Pilot</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
    h1 { font-size: 1.3rem; }
    nav button { padding: .5rem 1rem; margin-right: .25rem; cursor: pointer; }
    nav button.active { font-weight: bold; }
    .tab { display: none; margin-top: 1rem; }
    .tab.active { display: block; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8884; vertical-align: top; }
    code { font-family: ui-monospace, monospace; }
    .toolbar { margin-bottom: .5rem; }
  </style>
</head>
<body>
  <h1>Skytech Energy Pilot</h1>
  <nav>
    <button data-tab="status" class="active">Status</button>
    <button data-tab="logs">Logs</button>
  </nav>

  <section id="status" class="tab active">
    <div class="kv" id="health"></div>
  </section>

  <section id="logs" class="tab">
    <div class="toolbar">
      <button id="refresh-logs">Aktualisieren</button>
      <a id="export-logs" href="api/logs/export">Export (JSONL)</a>
    </div>
    <table>
      <thead><tr><th>Zeit</th><th>Level</th><th>Komponente</th><th>Nachricht</th></tr></thead>
      <tbody id="log-rows"></tbody>
    </table>
  </section>

  <script>
    // Ingress liefert relative Pfade; daher API ohne führenden Slash ansprechen.
    function switchTab(name) {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.id === name));
    }
    document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));

    async function loadHealth() {
      const res = await fetch("api/health");
      const data = await res.json();
      const el = document.getElementById("health");
      el.innerHTML = Object.entries(data)
        .map(([k, v]) => `<div>${k}</div><div><code>${v}</code></div>`)
        .join("");
    }

    async function loadLogs() {
      const res = await fetch("api/logs?limit=200");
      const rows = await res.json();
      document.getElementById("log-rows").innerHTML = rows
        .map((r) => `<tr><td>${r.ts}</td><td>${r.level}</td><td>${r.component}</td><td>${r.message}</td></tr>`)
        .reverse()
        .join("");
    }

    document.getElementById("refresh-logs").addEventListener("click", loadLogs);
    loadHealth();
    loadLogs();
  </script>
</body>
</html>
