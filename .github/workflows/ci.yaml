name: CI

# Automatische Tests laufen ausschließlich für den Branch claude/main (Decision D-024)
on:
  push:
    branches: [claude/main]
  pull_request:
    branches: [claude/main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Tests (pytest + Coverage, Schwelle 60 %)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Addon-Image bauen (Smoke-Test)
        run: docker build --build-arg BUILD_FROM=python:3.11-alpine -t energy-pilot:ci .
