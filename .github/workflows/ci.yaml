name: CI

# Automatische Tests laufen für den Arbeits-Branch claude/stage sowie die drei
# Release-Channel-Branches (Decision D-024/D-053). Die Kanäle heißen real mit Bindestrich
# (stage-dev/-beta/-stable) — mit den Slash-Namen aus dem D-053-Text lief die CI auf keinem
# der drei Kanäle.
on:
  push:
    branches: [claude/stage, stage-dev, stage-beta, stage-stable]
  pull_request:
    branches: [claude/stage, stage-dev, stage-beta, stage-stable]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Tests (pytest + Coverage, Schwelle 60 %)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci
      - name: Typprüfung und Bündelung
        working-directory: frontend
        run: npm run build
      # Das Bündel liegt im Repo (docs/frontend.md). Diese Gegenprobe stellt sicher, dass
      # es zum Quellstand passt — ein vergessener Rebuild fiele sonst erst im laufenden
      # Addon auf, und zwar als alte Oberfläche über neuem Backend.
      - name: Committetes Bündel gegen den Quellstand prüfen
        run: |
          if ! git diff --quiet -- frontend/dist; then
            echo "::error::frontend/dist passt nicht zum Quellcode. Bitte 'npm run build' in frontend/ ausführen und das Ergebnis mitcommitten."
            git diff --stat -- frontend/dist
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Addon-Image bauen (Smoke-Test)
        run: docker build -t energy-pilot:ci .
