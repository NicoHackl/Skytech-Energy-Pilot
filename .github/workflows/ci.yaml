name: CI

# Automatische Tests laufen für den Arbeits-Branch claude/stage sowie die drei
# Release-Channel-Branches (Decision D-024/D-053). Die Kanäle heißen real mit Bindestrich
# (stage-dev/-beta/-stable) — mit den Slash-Namen aus dem D-053-Text lief die CI auf keinem
# der drei Kanäle.
on:
  push:
    branches: [claude/stage, stage-dev, stage-beta, stage-stable]
  pull_request:
    branches: [claude/stage, stage-dev, stage-beta, stage-stable]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Tests (pytest + Coverage, Schwelle 60 %)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Addon-Image bauen (Smoke-Test)
        run: docker build -t energy-pilot:ci .
