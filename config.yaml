# Home-Assistant-Addon-Manifest für Skytech Energy Pilot
name: Skytech Energy Pilot
version: "0.0.52"
slug: skytech_energy_pilot
description: KI-gestützte, vorausschauende Energieplanung für Home Assistant und Skytech HEMS
url: https://github.com/NicoHackl/Skytech-Energy-Pilot
arch:
  - aarch64
  - amd64
  - armv7
init: false
# Ingress-Weboberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 8098
panel_icon: mdi:robot
panel_title: Energy Pilot
# Zugriff auf die Home-Assistant-Core-API (liefert SUPERVISOR_TOKEN)
homeassistant_api: true
options:
  log_level: info
  provider: gemini
  model: gemini-2.5-flash
  # KI-Provider-Schlüssel (D-007/D-041); leer => KI-Planung deaktiviert. Wird nie geloggt.
  api_key: ""
  # Timeout je KI-Aufruf (s) und Rate-Limit-Drossel (Aufrufe/min; Gemini-Free ~10).
  ai_request_timeout_s: 30
  ai_rate_limit_per_min: 10
  # Determinismus (D-050): Sampling-Temperatur (0 = deterministisch) + fixer Seed sorgen dafür,
  # dass gleicher Kontext stabil dieselben Vorschlagsfelder liefert (statt je Lauf/Modell zu schwanken).
  ai_temperature: 0.0
  ai_seed: 42
  # Fehlende Pflicht-Vorschlagsfelder per gezieltem Nachforder-Aufruf ergänzen (ein Versuch),
  # bevor der Validator sie deterministisch aus dem Ist-Zustand auffüllt.
  ai_repair_missing: true
  planning_interval_min: 60
  plan_update_interval_min: 15
  forecast_horizon_h: 24
  min_confidence_percent: 70
  collect_interval_s: 30
  # Vorschlagswerte als sensor.ep_*_vorschlag nach HA schreiben (M2-Schreibweg, D-008).
  # false => reiner Beobachten-Modus: Plan bleibt in UI/DB, EP schreibt nichts nach HA.
  publish_suggestions: true
  # HEMS-Anbindung (D-036): Basis-URL des HEMS-Addons – genutzt für die Geräte-Discovery
  # UND die Status-Rückkopplung (M3). Leer => keine HEMS-Anbindung (dann keine Geräte-
  # Discovery, EP kennt keine Geräte). Beispiel (Addon-Hostname, Port 8099):
  # http://local_skytech_hems:8099
  hems_base_url: ""
  # HEMS-Status-Rückkopplung (M3): Intervall (s), in dem EP /api/status pollt, die beobachtete
  # Plan-Übereinstimmung (Vorschlag vs. Ist) ableitet und nach HA spiegelt.
  hems_status_interval_s: 60
  # Plan-/HEMS-Status als sensor.ep_plan_status / sensor.ep_hems_verbindung nach HA schreiben (M3).
  # false => nur in UI/DB sichtbar, kein HA-Schreibweg.
  publish_status: true
  # PV-Prognose: je Ausrichtung 4 Sensoren (Energie akt. Stunde / nächste Stunde / Rest heute / morgen).
  # EP summiert je Wert über alle Ausrichtungen. Jeder Wert liegt im State eines eigenen Sensors.
  pv_forecast: []
  pv_forecast_unit: kWh
  # Wetterprognose (OpenWeatherMap, direkt im EP abgerufen).
  # api_key leer => Wetterabruf aus. Koordinaten aus der HA-Zone (Attribute latitude/longitude).
  # units: metric|imperial|standard, lang: OWM-Sprachcode, refresh_min: Mindestabstand der Abrufe.
  # source: forecast3h (5-Tage/3-Stunden, Default) oder onecall (One Call API 4.0, Abo-pflichtig).
  weather:
    api_key: ""
    zone_entity: zone.home
    units: metric
    lang: de
    source: forecast3h
    refresh_min: 60
    # Detailgrad der Wetterdaten ans LLM (nur forecast3h): compact (Bewölkung/Regen/Temp bis
    # Planungshorizont, spart Tokens) oder full (volle 5-Tage-Prognose, genauer aber mehr Tokens).
    llm_detail: compact
    # One Call API 4.0: je Vorhersagemodell (15min/1h/1day) per Schalter (enable_*) aktivierbar mit
    # eigenem Refresh-Intervall (Minuten). Jedes AKTIVE Modell ist ein eigener bezahlter Call UND
    # fließt in den KI-Kontext — beliebige Kombination wählbar (kein Einzel-Select mehr). Ans LLM
    # gehen: aktive intraday-Modelle (15min/1h) für HEUTE ab jetzt (frühestens 6 Uhr) bis 21 Uhr
    # Ortszeit, das Tagesmodell (1day) für die nächsten 5 Tage ab morgen.
    # pages_*: 1–5 paginierte Seiten je Modell und Refresh (mehr Horizont, aber je Seite ein
    #   eigener bezahlter Call). daily_call_budget: harte Tagesobergrenze ALLER bezahlten One-Call-
    #   Anfragen (Modelle + Alerts), UTC-Tag; schützt vor Überschreiten des Kontingents (Default
    #   1000 = OWM-Freikontingent). enable_alerts/refresh_alerts: behördliche Unwetterwarnungen.
    onecall:
      enable_15min: false
      enable_1h: true
      enable_1day: true
      refresh_15min: 15
      refresh_1h: 60
      refresh_1day: 180
      pages_15min: 1
      pages_1h: 1
      pages_1day: 1
      daily_call_budget: 1000
      enable_alerts: true
      refresh_alerts: 30
  # Weiche Zielgewichte (Prozent 0–100, D-011). Initialwerte aus info.md §7.
  # Harte Grenzen sind nicht hier, sondern werden aus den ems_*-Werten abgeleitet (constraints.py).
  objective_weights:
    versorgungssicherheit: 100
    eauto_ladeziel: 100
    warmwasserkomfort: 100
    netzbezug: 90
    stromkosten: 85
    eigenverbrauch: 80
    einspeisung: 70
    batterieschonung: 50
  # Sensor-Zuordnung als eigene aufklappbare Gruppe (entity_ = HA-Entität).
  # Warmwassertemperatur ist NICHT systemweit, sondern gerätespezifisch (Geräte-Tab).
  sensoren:
    entity_pv_power: ""
    entity_house_load: ""
    entity_grid_power: ""
    entity_grid_import: ""
    entity_grid_export: ""
    entity_battery_power: ""
    entity_battery_soc: ""
schema:
  log_level: list(debug|info|warning|error)
  provider: list(gemini|openai)
  model: str
  api_key: password?
  ai_request_timeout_s: int(5,600)?
  ai_rate_limit_per_min: int(1,60)?
  ai_temperature: float(0,2)?
  ai_seed: int?
  ai_repair_missing: bool?
  planning_interval_min: int(15,60)
  plan_update_interval_min: int(5,60)
  forecast_horizon_h: int(12,48)
  min_confidence_percent: int(0,100)
  collect_interval_s: int(5,300)
  publish_suggestions: bool?
  hems_base_url: str?
  hems_status_interval_s: int(10,3600)?
  publish_status: bool?
  pv_forecast:
    - label: str?
      current_hour: str?
      next_hour: str?
      remaining_today: str?
      tomorrow: str?
  pv_forecast_unit: str?
  weather:
    api_key: password?
    zone_entity: str?
    units: list(metric|imperial|standard)?
    lang: str?
    source: list(forecast3h|onecall)?
    refresh_min: int(1,720)?
    llm_detail: list(compact|full)?
    onecall:
      enable_15min: bool?
      enable_1h: bool?
      enable_1day: bool?
      refresh_15min: int(1,1440)?
      refresh_1h: int(1,1440)?
      refresh_1day: int(1,1440)?
      pages_15min: int(1,5)?
      pages_1h: int(1,5)?
      pages_1day: int(1,5)?
      daily_call_budget: int(1,100000)?
      enable_alerts: bool?
      refresh_alerts: int(1,1440)?
  objective_weights:
    versorgungssicherheit: int(0,100)?
    eauto_ladeziel: int(0,100)?
    warmwasserkomfort: int(0,100)?
    netzbezug: int(0,100)?
    stromkosten: int(0,100)?
    eigenverbrauch: int(0,100)?
    einspeisung: int(0,100)?
    batterieschonung: int(0,100)?
  sensoren:
    entity_pv_power: str?
    entity_house_load: str?
    entity_grid_power: str?
    entity_grid_import: str?
    entity_grid_export: str?
    entity_battery_power: str?
    entity_battery_soc: str?
