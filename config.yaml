# Home-Assistant-Addon-Manifest für Skytech Energy Pilot
name: Skytech Energy Pilot
version: "0.0.12"
slug: skytech_energy_pilot
description: KI-gestützte, vorausschauende Energieplanung für Home Assistant und Skytech HEMS
url: https://github.com/NicoHackl/Skytech-Energy-Pilot
arch:
  - aarch64
  - amd64
  - armv7
init: false
# Ingress-Weboberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 8098
panel_icon: mdi:robot
panel_title: Energy Pilot
# Zugriff auf die Home-Assistant-Core-API (liefert SUPERVISOR_TOKEN)
homeassistant_api: true
options:
  log_level: info
  provider: gemini
  model: gemini-3.5-flash
  # KI-Provider-Schlüssel (D-007/D-041); leer => KI-Planung deaktiviert. Wird nie geloggt.
  api_key: ""
  # Timeout je KI-Aufruf (s) und Rate-Limit-Drossel (Aufrufe/min; Gemini-Free ~10).
  ai_request_timeout_s: 30
  ai_rate_limit_per_min: 10
  planning_interval_min: 60
  plan_update_interval_min: 15
  forecast_horizon_h: 24
  min_confidence_percent: 70
  collect_interval_s: 30
  # HEMS-Geräte-Discovery (D-036): Basis-URL des HEMS-Addons. Leer => nur Config-Fallback unten.
  # Beispiel (Addon-Hostname, Port 8099): http://local_skytech_hems:8099
  hems_base_url: ""
  # Fallback-Geräteliste, falls HEMS nicht erreichbar ist (sonst via HEMS-Schema erkannt).
  devices: []
  # PV-Prognose: je Ausrichtung 4 Sensoren (Energie akt. Stunde / nächste Stunde / Rest heute / morgen).
  # EP summiert je Wert über alle Ausrichtungen. Jeder Wert liegt im State eines eigenen Sensors.
  pv_forecast: []
  pv_forecast_unit: kWh
  # Weiche Zielgewichte (Prozent 0–100, D-011). Initialwerte aus info.md §7.
  # Harte Grenzen sind nicht hier, sondern werden aus den ems_*-Werten abgeleitet (constraints.py).
  objective_weights:
    versorgungssicherheit: 100
    eauto_ladeziel: 100
    warmwasserkomfort: 100
    netzbezug: 90
    stromkosten: 85
    eigenverbrauch: 80
    einspeisung: 70
    batterieschonung: 50
  # Sensor-Zuordnung als eigene aufklappbare Gruppe (entity_ = HA-Entität, fallback_ = Ersatzwert).
  sensoren:
    entity_pv_power: ""
    fallback_pv_power: ""
    entity_house_load: ""
    fallback_house_load: ""
    entity_grid_power: ""
    fallback_grid_power: ""
    entity_grid_import: ""
    fallback_grid_import: ""
    entity_grid_export: ""
    fallback_grid_export: ""
    entity_battery_power: ""
    fallback_battery_power: ""
    entity_battery_soc: ""
    fallback_battery_soc: ""
    entity_water_temperature: ""
    fallback_water_temperature: ""
schema:
  log_level: list(debug|info|warning|error)
  provider: list(gemini|openai)
  model: str
  api_key: password?
  ai_request_timeout_s: int(5,120)?
  ai_rate_limit_per_min: int(1,60)?
  planning_interval_min: int(15,60)
  plan_update_interval_min: int(5,60)
  forecast_horizon_h: int(12,48)
  min_confidence_percent: int(0,100)
  collect_interval_s: int(5,300)
  hems_base_url: str?
  devices:
    - name: str
      entity_prefix: str?
      class: list(controllable|binary)
      output_unit: list(watt|ampere)?
  pv_forecast:
    - label: str?
      current_hour: str?
      next_hour: str?
      remaining_today: str?
      tomorrow: str?
  pv_forecast_unit: str?
  objective_weights:
    versorgungssicherheit: int(0,100)?
    eauto_ladeziel: int(0,100)?
    warmwasserkomfort: int(0,100)?
    netzbezug: int(0,100)?
    stromkosten: int(0,100)?
    eigenverbrauch: int(0,100)?
    einspeisung: int(0,100)?
    batterieschonung: int(0,100)?
  sensoren:
    entity_pv_power: str?
    fallback_pv_power: str?
    entity_house_load: str?
    fallback_house_load: str?
    entity_grid_power: str?
    fallback_grid_power: str?
    entity_grid_import: str?
    fallback_grid_import: str?
    entity_grid_export: str?
    fallback_grid_export: str?
    entity_battery_power: str?
    fallback_battery_power: str?
    entity_battery_soc: str?
    fallback_battery_soc: str?
    entity_water_temperature: str?
    fallback_water_temperature: str?
