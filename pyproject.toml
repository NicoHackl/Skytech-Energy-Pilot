[project]
name = "skytech-energy-pilot"
version = "0.0.1"
description = "KI-gestützte, vorausschauende Energieplanung für Home Assistant und Skytech HEMS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["energy_pilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
